<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>내공 기숙캠프 — 2027년 여름에 다시 만나요</title>
<meta name="description" content="2026년 겨울캠프만 잠시 쉬어갑니다. 2027년 여름에 다시 뵙겠습니다." />
<link rel="icon" href="images/logo-icon.png" />
<style>
:root{--navy:#0B2A5B;--navy2:#163C7A;--gold:#C9A56A;--cream:#F7F4EE}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:#fff;background:var(--navy);
  display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
.bg{position:fixed;inset:0;background:url(images/bg.jpg) center/cover no-repeat;filter:blur(6px) saturate(.9);transform:scale(1.08);opacity:.55}
.veil{position:fixed;inset:0;background:linear-gradient(160deg,rgba(11,42,91,.92),rgba(22,60,122,.86))}
.card{position:relative;z-index:1;max-width:560px;width:100%;text-align:center;padding:56px 32px 44px;
  background:rgba(255,255,255,.06);border:1px solid rgba(201,165,106,.35);border-radius:24px;backdrop-filter:blur(8px);
  box-shadow:0 30px 80px rgba(0,0,0,.35);animation:rise .9s ease both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.logo{height:58px;margin:0 auto 10px;display:block}
.brand{font-size:14px;letter-spacing:.2em;color:var(--gold);font-weight:700;margin-bottom:34px}
.rule{width:56px;height:2px;background:var(--gold);margin:0 auto 30px;border-radius:2px}
h1{font-size:clamp(25px,6vw,34px);line-height:1.5;font-weight:800;letter-spacing:-.01em}
h1 .gold{color:var(--gold)}
.sub{margin-top:22px;font-size:clamp(16px,4vw,19px);line-height:1.8;color:rgba(255,255,255,.88)}
.sub b{color:#fff;border-bottom:2px solid var(--gold);padding-bottom:1px}
.btn{display:inline-block;margin-top:34px;padding:14px 28px;border-radius:999px;background:var(--gold);color:var(--navy);
  font-weight:800;font-size:15px;text-decoration:none;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(201,165,106,.35)}
.note{margin-top:14px;font-size:13px;color:rgba(255,255,255,.6)}
.foot{margin-top:36px;font-size:12px;color:rgba(255,255,255,.45)}
@media(max-width:480px){.card{padding:44px 22px 36px}}
</style>
</head>
<body>
<div class="bg"></div><div class="veil"></div>
<main class="card">
  <img class="logo" src="images/logo-icon.png" alt="내공 기숙캠프 로고" />
  <div class="brand">내공 기숙캠프</div>
  <div class="rule"></div>
  <h1>2026년 겨울캠프만<br/><span class="gold">잠시 쉬어갑니다.</span></h1>
  <p class="sub"><b>2027년 여름</b>에<br/>다시 뵙겠습니다.</p>
  <a class="btn" href="http://pf.kakao.com/_uxkxosX" target="_blank" rel="noopener">카카오톡 채널로 문의하기</a>
  <div class="note">카카오톡 채널 @내공기숙캠프</div>
  <div class="foot">© 내공에듀. 그동안 보내주신 관심에 감사드립니다.</div>
</main>
</body>
</html>
