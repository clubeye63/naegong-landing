<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>내공 기숙캠프</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Noto Sans KR', -apple-system, sans-serif;
    background: #0B2A5B;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: #fff;
    text-align: center;
    padding: 24px;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .logo img { height: 40px; width: auto; }
  .logo span { font-size: 20px; font-weight: 700; color: #fff; }
  .badge {
    display: inline-block;
    background: rgba(184,147,90,.25);
    border: 1px solid rgba(184,147,90,.5);
    border-radius: 100px;
    padding: 6px 20px;
    font-size: 13px;
    font-weight: 700;
    color: #D4B88A;
    letter-spacing: 0.05em;
  }
  h1 {
    font-size: clamp(28px, 6vw, 52px);
    font-weight: 900;
    line-height: 1.2;
    letter-spacing: -0.02em;
  }
  p {
    font-size: clamp(15px, 2vw, 18px);
    color: rgba(255,255,255,0.65);
    line-height: 1.7;
  }
  .dots {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 8px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(184,147,90,0.4);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.3); background: #D4B88A; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <img src="images/logo.png" alt="내공에듀 로고" />
      <span>내공기숙캠프</span>
    </div>
    <div class="badge">2026 연세대 썸머 멘토링 캠프</div>
    <h1>곧 오픈합니다.</h1>
    <p>더 나은 서비스로 준비 중입니다.<br/>잠시만 기다려 주세요.</p>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</body>
</html>
